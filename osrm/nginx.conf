# 브라우저(메디패스 웹앱)에서 바로 부를 수 있도록 CORS를 열고, 공개 서버와 같은 경로로 맞춘다.
server {
  listen 80;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  if ($request_method = OPTIONS) { return 204; }

  location /routed-car/  { proxy_pass http://car:5000/;  proxy_read_timeout 15s; }
  location /routed-foot/ { proxy_pass http://foot:5000/; proxy_read_timeout 15s; }
  location = /health { return 200 "ok\n"; }
}
