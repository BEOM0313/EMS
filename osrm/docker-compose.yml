# 메디패스용 자체 OSRM 서버
#   car  : 차량 경로 (osrm-routed, MLD)
#   foot : 도보 경로
#   proxy: nginx. 공개 FOSSGIS 서버와 같은 주소 구조(/routed-car, /routed-foot)로 묶고 CORS 허용
# 실행: ./prepare.sh 한 번 → docker compose up -d → http://localhost:8088/routed-car/route/v1/driving/126.97797,37.56654;126.97689,37.57592
services:
  car:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    command: osrm-routed --algorithm mld --max-table-size 500 /data/korea.osrm
    volumes: ["./data/car:/data:ro"]
    restart: unless-stopped
  foot:
    image: ${OSRM_IMAGE:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    command: osrm-routed --algorithm mld --max-table-size 500 /data/korea.osrm
    volumes: ["./data/foot:/data:ro"]
    restart: unless-stopped
  proxy:
    image: nginx:1.27-alpine
    ports: ["8088:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [car, foot]
    restart: unless-stopped
